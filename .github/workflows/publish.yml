name: Publish site
# Publishes public/ to the gh-pages branch (served by GitHub Pages) whenever main
# changes, but only after the same checks as checks.yml pass.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-site
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - run: bash scripts/publish-pages.sh
